background_opacity: 0.90

window:
  decorations: none

font:
  normal:
    family: Fira Code
    style: Medium

  bold:
    family: Fira Code
    style: Bold

  italic:
    family: Hasklig
    style: Semibold Italic

  size: 12

colors:
  # Default colors
  primary:
    background: '0x000000' #000000
    foreground: '0xFFFFFF' #FFFFFF

  # Normal colors
  normal:
    black:   '0x000000' #000000
    red:     '0xFF0000' #FF0000
    green:   '0x00FF00' #00FF00
    yellow:  '0xFFFF00' #FFFF00
    blue:    '0x0000FF' #0000FF
    magenta: '0xFF00FF' #FF00FF
    cyan:    '0x00FFFF' #00FFFF
    white:   '0xFFFFFF' #FFFFFF

  # Bright colors
  bright:
    black:   '0x0a0f14' #0a0f14
    red:     '0xc33027' #c33027
    green:   '0x26a98b' #26a98b
    yellow:  '0xedb54b' #edb54b
    blue:    '0x195465' #195465
    magenta: '0x4e0065' #4e0065
    cyan:    '0x33859d' #33859d
    white:   '0xAAAAAA' #AAAAAA


scrolling:
  history: 10000

  multiplier: 3
  faux-multiplier: 3

mouse_bindings:
  - { mouse: Middle, action: PasteSelection }
