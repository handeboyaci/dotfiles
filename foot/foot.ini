# Foot Terminal Configuration
# Migrated from your alacritty.toml and double-checked for accuracy.

#==============================================================================
# Main Section: Core Terminal Behavior
#==============================================================================
[main]
# Font configuration using FontConfig syntax.
# "FiraCode Nerd Font" is recommended over "Fira Code" to ensure icons
# from modern terminal applications render correctly.
font=Fira Code:style=Medium:size=12
font-bold=Fira Code:style=Bold:size=12
font-italic=Fira Code:style=Light:size=12


# Wayland application ID.
app-id=foot

# Initial window title.
title=foot

#==============================================================================
# Window and Geometry Section
#==============================================================================
# Foot does not have a direct equivalent for Alacritty's `decorations = "none"`.
# This behavior is typically controlled by your Wayland compositor (e.g., Sway, Hyprland).
# For compositors like GNOME that lack server-side decorations, you can enable
# client-side borders in the [csd] section below if desired.

#==============================================================================
# Scrollback Section
#==============================================================================
[scrollback]
# Number of lines of history to keep.
# Maps to Alacritty's `scrolling.history = 10000`.
lines=10000

#==============================================================================
# Colors Section
#==============================================================================
[colors]
# Background transparency.
# Maps to Alacritty's `window.opacity = 0.9`.
alpha=0.9

# Primary background and foreground colors.
# Maps to Alacritty's `colors.primary`.
background=000000
foreground=FFFFFF

## Normal colors
# Maps to Alacritty's `colors.normal`.
regular0=000000  # black
regular1=FF0000  # red
regular2=00FF00  # green
regular3=FFFF00  # yellow
regular4=0000FF  # blue
regular5=FF00FF  # magenta
regular6=00FFFF  # cyan
regular7=FFFFFF  # white

## Bright colors
# Maps to Alacritty's `colors.bright`.
bright0=0a0f14   # bright black
bright1=c33027   # bright red
bright2=26a98b   # bright green
bright3=edb54b   # bright yellow
bright4=195465   # bright blue
bright5=4e0065   # bright magenta
bright6=33859d   # bright cyan
bright7=AAAAAA   # bright white

#==============================================================================
# Mouse Bindings Section
#==============================================================================
[mouse-bindings]
# Paste from primary selection with the middle mouse button.
# Maps to Alacritty's `action = "PasteSelection", mouse = "Middle"`.
primary-paste=BTN_MIDDLE

