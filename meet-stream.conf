# Meet Stream Configuration (~/.config/meet-stream.conf)

# Target selection: "auto" picks lan_host when connected to lan_ssid or when
# lan_host is reachable on the local network; otherwise falls back to wan_host.
target_host = auto
lan_host = 192.168.1.12
wan_host = sncr.duckdns.org
lan_ssid = ev

# Single multiplexed UDP port for encrypted + authenticated audio, video & control
port = 46002

# Loopback RTP port on remote host where PipeWire source-moonlight-mic listens (127.0.0.1 only)
local_audio_port = 46000

# Shared 256-bit secret key file (auto-generated with 0600 permissions if missing)
secret_key_file = ~/.dotfiles/tmp/meet-stream.key

# Optional SSH host alias (from ~/.ssh/config) for --sync-key
ssh_host = ev

# Remote host virtual camera v4l2loopback device
loopback_device = /dev/video10

# Video & Audio encoding settings
video_encoder = auto
video_bitrate = 2000
audio_bitrate = 64000

# Seconds of inactivity before remote receiver (--serve) shuts down all pipelines and exits
idle_timeout_sec = 5

# Wayland Overlay Theme (matches statusbar.conf & launcher)
bg_color = rgba(14, 16, 22, 0.85)
card_bg = rgba(24, 26, 32, 0.96)
card_border = #3eaeff
text_color = #ffffff
muted_color = #888888
accent_color = #3eaeff
active_color = #2ecc71
danger_color = #cc6666
