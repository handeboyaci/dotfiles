context.modules = [
    {
        name = libpipewire-module-rtp-source
        args = {
            source.ip = "0.0.0.0"
            source.port = 46000
            sess.media = "opus"
            sess.ignore-ssrc = true
            sess.latency.msec = 20
            stream.props = {
                media.class = "Audio/Source"
                node.name = "source-moonlight-mic"
                node.description = "Moonlight Remote Microphone"
                audio.position = [ "MONO" ]
            }
        }
        condition = [
            { application.process.host = "server" }
            { application.process.host = "~^server(\\..*)?$" }
            { application.process.host = "ev" }
            { application.process.host = "~^ev(\\..*)?$" }
        ]
    }
]
