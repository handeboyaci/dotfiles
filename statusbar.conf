# Statusbar Configuration (~/.config/statusbar.conf)

# Timezones and optional emoji/label per zone (format: TZ[=LABEL])
tz = America/New_York=🗽, Europe/Zurich=🇨🇭, Asia/Istanbul=🇹🇷

# Google Calendar OAuth token file & calendars to merge
gcal_token = ~/.dotfiles/tmp/google_calendar.auth.token
gcal_calendars = primary, sencerselcuk@gmail.com

# Command to launch Google Calendar on right-click / middle-click
# Chrome profiles: "Profile 1" = sselcuk@google.com 
gcal_open_cmd = google-chrome --profile-directory="Profile 1" --app=https://calendar.google.com/

# Location regexes/prefixes to prioritize and strip from room names (in priority order)
# Default fallback:
relevant_locations = US-NYC-9TH-([^-]+-[^-]+-Phone Room )?, NYC-([^-]+-[^-]+-Phone Room )?
relevant_locations[Europe/Zurich]       = CH-ZRH-([^-]+-[^-]+-Phone Room )?, ZRH-([^-]+-[^-]+-Phone Room )?
relevant_locations[America/Los_Angeles] = US-MTV-([^-]+-[^-]+-Phone Room )?, MTV-([^-]+-[^-]+-Phone Room )?

# Filter (dim in tooltip / hide from bar) events longer than this threshold
ignore_long_event_threshold = 6h

# Filter events matching these titles/patterns (only shown in hover tooltip, dimmed)
ignored_events = "DNS", "DND", "Commute"

# Urgent notification lead time before meeting start (minutes, 0 to disable)
gcal_notify_mins = 5

# Offline astronomical prayer times (Moonsighting Committee)
auto_location = true
