# vi: ft=swayconfig
output HEADLESS-1 resolution 1920x1200@60Hz

output * allow_tearing yes
output * max_render_time off

input * events disabled
input "48879:57005:Keyboard_passthrough" {
    events enabled
    xkb_layout "us"
    xkb_options "caps:super"
    repeat_delay 750
    repeat_rate 25
}
input "4617:2:libvirtualhid_Keyboard" {
    events enabled
    xkb_layout "us"
    xkb_options "caps:super"
    repeat_delay 750
    repeat_rate 25
}
input "48879:57005:Mouse_passthrough" events enabled
input "48879:57005:Mouse_passthrough_(absolute)" events enabled
input "4617:3:libvirtualhid_Mouse" events enabled
input "4617:3:libvirtualhid_Mouse_(Absolute)" events enabled
input "4617:4:libvirtualhid_Touchscreen" events enabled
input "4617:5:libvirtualhid_Pen" events enabled
input "4617:5:libvirtualhid_Pen_Tablet" events enabled
input "48879:57005:Touch_passthrough" events enabled
input "48879:57005:Pen_passthrough" events enabled
input "1356:3302:Sunshine_PS5_(virtual)_pad_Touchpad" events enabled

# Flat acceleration for mouse passthrough
input "48879:57005:Mouse_passthrough" accel_profile flat
input "48879:57005:Mouse_passthrough_(absolute)" accel_profile flat
input "4617:3:libvirtualhid_Mouse" accel_profile flat
input "4617:3:libvirtualhid_Mouse_(Absolute)" accel_profile flat


include $HOME/.config/sway/config
