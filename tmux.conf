unbind-key C-b
bind-key 'C-\' send-prefix
set -g prefix 'C-\'

unbind-key '"'
unbind-key %
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '|' split-window -fh -c "#{pane_current_path}"
bind-key '_' split-window -fv -c "#{pane_current_path}"

bind-key C-l send-keys 'C-l'
is_vim='#{m/r:^(g?(view|n?vim?x?)(diff)?)$,#{pane_current_command}}'
bind-key -n C-h if -F "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if -F "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if -F "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if -F "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -r C-h send-keys C-h
bind-key -r C-j send-keys C-j
bind-key -r C-k send-keys C-k
bind-key -r C-l send-keys C-l
# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

has_pager='#{m/r:^(g?(view|n?vim?x?)(diff)?|less|man|fzf)$,#{pane_current_command}}'
bind-key -T root PageUp if -F "$has_pager" "send-keys PageUp" "copy-mode -eu"

bind-key -r Space next-layout

bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

bind-key -n WheelUpPane if-shell -Ft= "#{pane_in_mode}" "send -M" "copy-mode -e"

set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/zsh
set -g default-command /usr/bin/zsh
set -g history-limit 100000
set -g mode-keys vi
set -g status-keys emacs
set -g renumber-windows on
set -g aggressive-resize on
set -g set-titles on
set -g monitor-activity on
set -g focus-events on
set -g escape-time 0
set -g status-interval 0
set -g mouse on
set -g status-position top
set -g detach-on-destroy no-detached
set -g update-environment[100] WAYLAND_DISPLAY
set -g update-environment[101] SWAYSOCK

unbind-key ']'
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

bind-key -T root C-F12  \
  set prefix None \;\
  set key-table off \;\
  set status off \;\
  bind-key -T off F1 run-shell '~/.dotfiles/bin/tmux-sync-clipboard' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off C-F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status \;\
  bind-key -n F1 run-shell '~/.dotfiles/bin/tmux-sync-clipboard' \;\
  refresh-client -S

bind-key -T root F12 set status

# theme
set -g set-clipboard on
bind-key -n F1 run-shell -b '~/.dotfiles/bin/tmux-sync-clipboard'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g terminal-features[100] '*:clipboard,*:RGB,*:extkeys,*:XT,*:hyperlinks'
set -g terminal-overrides[100] ',*:RGB:XT'

set -g status-right "$WORKSTATION_NAME"
set -g status-style bg='#004466',fg='#E5DAB2'
set -g message-style bg='#446600',fg='#E5DAB2'
set -g message-command-style bg='#660044',fg='#E5DAB2'
set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bg=#E5DAB2,fg=#004466,bold] #I:#W '
set -g window-status-activity-style fg='#FFFFFF'
set -g window-status-bell-style bg='#660044',fg='#E5DAB2'

set -g @thumbs-key C-Space
set -g @thumbs-no-prefix 1
set -g @thumbs-bg-color "default"
set -g @thumbs-alt-bg-color "#2A3141"
set -g @thumbs-faint 1
set -g @thumbs-fg-color "#66FF33"
set -g @thumbs-hint-fg-color "#2E3440"
set -g @thumbs-hint-bg-color "#FF6633"
set -g @thumbs-select-fg-color "#2E3440"
set -g @thumbs-select-bg-color "#88C0D0"
set -g @thumbs-unique 1
set -g @thumbs-reverse 1
set -g @thumbs-position off_left
set -g @thumbs-command 'tmux set-buffer -w -- "{}"'
set -g @thumbs-upcase-command 'tmux send-keys -t "{active_pane}" -l -- "{}"'
set -g @thumbs-regexp-1 '~?/{0,3}(?:[\w.*${}:@+~%]+(?:[=\-][\w.*${}:@+~%]+)*/)+(?:[\w.*${}:@+~%]+(?:[?@=\-][\w.*${}:@+~%]*)*)?'
set -g @thumbs-regexp-2 '\b[a-z]{7,12}\b'
set -s command-alias[100] 'thumbs-pick=run-shell -b "$HOME/.dotfiles/tmux/tmux-thumbs/target/release/tmux-thumbs --dir $HOME/.dotfiles/tmux/tmux-thumbs"'
bind-key -n C-Space thumbs-pick
run-shell -b '~/.dotfiles/tmux/tmux-thumbs-check.sh'

