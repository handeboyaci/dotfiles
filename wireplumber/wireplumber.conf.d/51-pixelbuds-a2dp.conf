monitor.bluez.properties = {
  # Exclude opus_g (Google vendor 0x00e0:0x0001 spatial audio codec), which
  # times out on AVDTP Start on Linux (errno 110) and causes PipeWire/WirePlumber
  # to fall back from stereo A2DP to mono HFP/HSP (headset-head-unit) call mode.
  bluez5.codecs = [ sbc sbc_xq aac ldac aptx aptx_hd ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
